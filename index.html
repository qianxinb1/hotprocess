@media (max-width:768px) {

</style>
</head>

const CATEGORIES = ["钛合金", "高温合金", "超高强度钢", "铝合金"];

function renderSidebar() {
  const list = document.getElementById('material-list');
  let html = '';
  for (const cat of CATEGORIES) {
    const items = Object.entries(DATA).filter(([k,v]) => v.category === cat);
    html += `<div class="cat-group">`;
    html += `<div class="cat-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')"><span class="arrow">▼</span>${cat} (${items.length})</div>`;
    html += `<div class="cat-items">`;
    for (const [code, m] of items) {
      html += `<div class="mat-item" data-code="${code}" data-cat="${cat}" onclick="selectMaterial('${code}')"><span class="mat-code">${code}</span><span class="mat-name">${m.subcategory||''}</span></div>`;
    }
    html += `</div></div>`;
  }
  list.innerHTML = html;
}

function selectMaterial(code) {
  currentMaterial = code;
  document.querySelectorAll('.mat-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.mat-item[data-code="${code}"]`)?.classList.add('active');
  renderMaterial(code);
}

function getBadge(cat) {
  const map = {'钛合金':'badge-ti','高温合金':'badge-ni','超高强度钢':'badge-steel','铝合金':'badge-al'};
  return map[cat] || 'badge-ti';
}

function getCategoryColor(cat) {
  const map = {'钛合金':'#1565c0','高温合金':'#c62828','超高强度钢':'#283593','铝合金':'#2e7d32'};
  return map[cat] || '#666';
}

function renderMaterial(code) {
  const m = DATA[code];
  if (!m) return;
  
  let heatHtml = '';
  if (m.heatTreatment && m.heatTreatment.length > 0) {
    heatHtml = `<div class="section-card">
      <div class="section-header" onclick="toggleSection(this)"><h3>🔥 热处理工艺参数</h3><span class="toggle">▼</span></div>
      <div class="section-body"><table><thead><tr><th>工艺类型</th><th>温度</th><th>保温时间</th><th>冷却方式</th><th>备注</th></tr></thead><tbody>`;
    for (const h of m.heatTreatment) {
      heatHtml += `<tr><td><strong>${h.process}</strong></td><td><span class="tag tag-temp">${h.temp}</span></td><td>${h.time}</td><td><span class="tag tag-cool">${h.cooling}</span></td><td style="font-size:12px;color:var(--text-light);">${h.note||''}</td></tr>`;
    }
    heatHtml += `</tbody></table></div></div>`;
  }

  let deformHtml = '';
  if (m.hotDeformation && m.hotDeformation.length > 0) {
    deformHtml = `<div class="section-card">
      <div class="section-header" onclick="toggleSection(this)"><h3>🔨 热变形/热加工工艺参数</h3><span class="toggle">▼</span></div>
      <div class="section-body"><table><thead><tr><th>工艺类型</th><th>温度</th><th>应变速率</th><th>变形量</th><th>备注</th></tr></thead><tbody>`;
    for (const d of m.hotDeformation) {
      deformHtml += `<tr><td><strong>${d.process}</strong></td><td><span class="tag tag-temp">${d.temp}</span></td><td><span class="tag tag-rate">${d.strainRate}</span></td><td>${d.deformation}</td><td style="font-size:12px;color:var(--text-light);">${d.note||''}</td></tr>`;
    }
    deformHtml += `</tbody></table></div></div>`;
  }

  let probHtml = '';
  if (m.problems && m.problems.length > 0) {
    probHtml = `<div class="section-card">
      <div class="section-header" onclick="toggleSection(this)"><h3>⚠️ 热处理/热加工常见问题及解决方案</h3><span class="toggle">▼</span></div>
      <div class="section-body">`;
    for (const p of m.problems) {
      probHtml += `<div class="problem-item"><h4>${p.name}</h4><div class="cause"><strong>成因：</strong>${p.cause}</div><div class="solution"><strong>解决方案：</strong>${p.solution}</div></div>`;
    }
    probHtml += `</div></div>`;
  }

  const isInCompare = compareList.includes(code);
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="header-bar">
      <h2>${m.fullName}</h2>
      <span class="badge ${getBadge(m.category)}">${m.category}</span>
      ${m.subcategory ? `<span class="badge" style="background:#f5f5f5;color:#666;">${m.subcategory}</span>` : ''}
      <button class="compare-btn-add" onclick="toggleCompare('${code}')" style="margin-left:auto;">${isInCompare ? '✓ 已加入对比' : '+ 加入对比'}</button>
    </div>
    <div class="summary-card">
      <p>${m.summary}</p>
      <div class="info-grid">
        <div class="info-item"><div class="label">相变温度 / β相变点</div><div class="value">${m.tBeta||'N/A'}</div></div>
        <div class="info-item"><div class="label">材料类别</div><div class="value">${m.category} · ${m.subcategory||''}</div></div>
        <div class="info-item"><div class="label">应用领域</div><div class="value">${m.applications||'航空航天、国防军工、高端装备制造'}</div></div>
        <div class="info-item"><div class="label">热处理工艺数</div><div class="value">${(m.heatTreatment||[]).length} 项</div></div>
        <div class="info-item"><div class="label">热变形工艺数</div><div class="value">${(m.hotDeformation||[]).length} 项</div></div>
        <div class="info-item"><div class="label">已知问题数</div><div class="value">${(m.problems||[]).length} 项</div></div>
      </div>
    </div>
    <div class="compare-bar" id="compare-bar"></div>
    ${heatHtml}
    ${deformHtml}
    ${probHtml}
  `;
  updateCompareBar();
}

function updateCompareBar() {
  const bar = document.getElementById('compare-bar');
  if (!bar) return;
  if (compareList.length === 0) {
    bar.innerHTML = `<span style="opacity:0.5;">📊 对比模式：点击任意材料的"+ 加入对比"按钮，选择最多5种材料进行工艺参数对比</span>`;
  } else {
    bar.innerHTML = `
      <span>📊 对比列表 (${compareList.length}/5)：</span>
      <div class="selected-tags">
        ${compareList.map(c => `<span class="compare-tag" onclick="selectMaterial('${c}')">${c} <span class="remove" onclick="event.stopPropagation();toggleCompare('${c}')">×</span></span>`).join('')}
      </div>
      ${compareList.length >= 2 ? `<button class="compare-btn compare-btn-go" onclick="renderComparison()">开始对比</button>` : ''}
      <button class="compare-btn compare-btn-clear" onclick="clearCompare()">清空</button>
    `;
  }
}

function toggleCompare(code) {
  const idx = compareList.indexOf(code);
  if (idx >= 0) { compareList.splice(idx, 1); }
  else if (compareList.length < 5) { compareList.push(code); }
  else { alert('最多同时对比5种材料'); return; }
  if (currentMaterial) renderMaterial(currentMaterial);
}

function clearCompare() { compareList = []; if (currentMaterial) renderMaterial(currentMaterial); }

function renderComparison() {
  const mats = compareList.map(c => DATA[c]);
  if (mats.length < 2) return;
  
  // Collect heat treatment temps
  let heatRows = [];
  mats.forEach(m => {
    (m.heatTreatment||[]).forEach(h => {
      heatRows.push({ material: Object.keys(DATA).find(k=>DATA[k]===m), process: h.process, temp: h.temp, time: h.time, cooling: h.cooling, note: h.note });
    });
  });

  let deformRows = [];
  mats.forEach(m => {
    (m.hotDeformation||[]).forEach(d => {
      deformRows.push({ material: Object.keys(DATA).find(k=>DATA[k]===m), process: d.process, temp: d.temp, strainRate: d.strainRate, deformation: d.deformation, note: d.note });
    });
  });

  let probRows = [];
  mats.forEach(m => {
    (m.problems||[]).forEach(p => {
      probRows.push({ material: Object.keys(DATA).find(k=>DATA[k]===m), name: p.name, cause: p.cause, solution: p.solution });
    });
  });

  const codes = compareList;
  let html = `<div class="header-bar"><h2>📊 材料工艺参数对比</h2><span class="badge" style="background:#f5f5f5;">${codes.join(' vs ')}</span></div>`;

  // Stats
  html += `<div class="stats-row">`;
  codes.forEach(c => {
    const m = DATA[c];
    html += `<div class="stat-card"><div class="stat-num">${(m.heatTreatment||[]).length + (m.hotDeformation||[]).length}</div><div class="stat-label">${c} 总工艺项</div></div>`;
  });
  html += `</div>`;

  // Heat treatment comparison
  if (heatRows.length > 0) {
    html += `<div class="compare-chart"><h3>🔥 热处理工艺参数对比</h3><div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th>工艺类型</th>${codes.map(c => `<th style="color:${getCategoryColor(DATA[c].category)};">${c}</th>`).join('')}</tr></thead><tbody>`;
    
    // Group by process type
    const processTypes = [...new Set(heatRows.map(r => r.process))];
    processTypes.forEach(pt => {
      html += `<tr><td>${pt}</td>`;
      codes.forEach(c => {
        const match = heatRows.find(r => r.material === c && r.process === pt);
        if (match) {
          html += `<td class="heatmap-cell"><div style="font-size:13px;">${match.temp}</div><div style="font-size:10px;color:#666;margin-top:2px;">${match.time} | ${match.cooling}</div></td>`;
        } else {
          html += `<td style="text-align:center;color:#ccc;">—</td>`;
        }
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  // Hot deformation comparison
  if (deformRows.length > 0) {
    html += `<div class="compare-chart"><h3>🔨 热变形工艺参数对比</h3><div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th>工艺类型</th>${codes.map(c => `<th style="color:${getCategoryColor(DATA[c].category)};">${c}</th>`).join('')}</tr></thead><tbody>`;
    const deformTypes = [...new Set(deformRows.map(r => r.process))];
    deformTypes.forEach(pt => {
      html += `<tr><td>${pt}</td>`;
      codes.forEach(c => {
        const match = deformRows.find(r => r.material === c && r.process === pt);
        if (match) {
          html += `<td class="heatmap-cell"><div style="font-size:13px;">${match.temp}</div><div style="font-size:10px;color:#666;margin-top:2px;">ε̇: ${match.strainRate}</div></td>`;
        } else {
          html += `<td style="text-align:center;color:#ccc;">—</td>`;
        }
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  // Problems comparison
  if (probRows.length > 0) {
    html += `<div class="compare-chart"><h3>⚠️ 常见问题对比</h3><div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th>问题类型</th>${codes.map(c => `<th style="color:${getCategoryColor(DATA[c].category)};">${c}</th>`).join('')}</tr></thead><tbody>`;
    const probTypes = [...new Set(probRows.map(r => r.name))];
    probTypes.forEach(pt => {
      html += `<tr><td>${pt}</td>`;
      codes.forEach(c => {
        const match = probRows.find(r => r.material === c && r.name === pt);
        if (match) {
          html += `<td style="font-size:11px;"><div style="color:#f57c00;">${match.cause.substring(0,60)}...</div><div style="color:#2e7d32;margin-top:2px;">${match.solution.substring(0,60)}...</div></td>`;
        } else {
          html += `<td style="text-align:center;color:#ccc;">—</td>`;
        }
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function toggleSection(header) {
  header.classList.toggle('collapsed');
  header.nextElementSibling.classList.toggle('collapsed');
}

// Search
document.getElementById('search-input').addEventListener('input', function(e) {
  const q = e.target.value.toUpperCase().trim();
  document.querySelectorAll('.mat-item').forEach(el => {
    const code = el.dataset.code || '';
    const cat = el.dataset.cat || '';
    const fullName = (DATA[code]||{}).fullName || '';
    const match = code.includes(q) || fullName.toUpperCase().includes(q) || cat.includes(q);
    el.style.display = (q === '' || match) ? 'flex' : 'none';
  });
  // Auto-expand categories with visible items
  document.querySelectorAll('.cat-group').forEach(g => {
    const visibleItems = g.querySelectorAll('.mat-item');
    let hasVisible = false;
    visibleItems.forEach(el => { if (el.style.display !== 'none') hasVisible = true; });
    const header = g.querySelector('.cat-header');
    const items = g.querySelector('.cat-items');
    if (q && hasVisible) {
      header.classList.remove('collapsed');
      items.classList.remove('collapsed');
    }
  });
});

// Init
renderSidebar();

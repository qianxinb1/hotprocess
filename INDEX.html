<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先进合金热加工与热处理工艺数据库</title>
<style>
  :root {
    --primary: #1a3a5c;
    --primary-light: #2d6096;
    --accent: #e8740a;
    --accent2: #1a8a6e;
    --accent3: #8a1a5c;
    --accent4: #5c1a8a;
    --bg: #f4f7fb;
    --card: #ffffff;
    --border: #dce4ef;
    --text: #1e2a38;
    --text2: #4a5a70;
    --text3: #7a8a9a;
    --tag-ti: #1a7a4e;
    --tag-al: #1a5a9a;
    --tag-st: #7a2a1a;
    --tag-ni: #5a1a7a;
    --warn: #c8400a;
    --warn-bg: #fff4ee;
    --success: #1a7a4e;
    --success-bg: #eefaf4;
    --info: #1a5a9a;
    --info-bg: #eef4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== TOP HEADER ===== */
  .top-header {
    background: linear-gradient(135deg, var(--primary) 0%, #0e2540 60%, #1a4060 100%);
    color: white;
    padding: 28px 40px 22px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .top-header h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
  .top-header p { color: rgba(255,255,255,0.72); font-size: 0.88rem; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header-stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat-chip {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.9);
    display: flex; align-items: center; gap: 6px;
  }
  .stat-chip span { font-weight: 700; font-size: 0.95rem; color: #fff; }

  /* ===== MAIN LAYOUT ===== */
  .main-layout {
    display: flex;
    min-height: calc(100vh - 110px);
  }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 110px;
    height: calc(100vh - 110px);
    overflow-y: auto;
  }
  .sidebar-section-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 10px 20px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px;
    cursor: pointer;
    border-radius: 0;
    font-size: 0.88rem;
    color: var(--text2);
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { background: rgba(26,90,154,0.08); color: var(--primary-light); border-left-color: var(--primary-light); font-weight: 600; }
  .nav-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .nav-badge {
    margin-left: auto;
    background: var(--bg);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 0.72rem;
    color: var(--text3);
  }

  /* ===== CONTENT AREA ===== */
  .content-area {
    flex: 1;
    padding: 28px 32px;
    overflow-y: auto;
  }

  /* ===== SEARCH & FILTER BAR ===== */
  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-input-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }
  .search-input {
    width: 100%;
    padding: 10px 16px 10px 42px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.92rem;
    background: var(--card);
    color: var(--text);
    transition: border-color 0.2s;
    outline: none;
  }
  .search-input:focus { border-color: var(--primary-light); }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }
  .filter-select {
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.88rem;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    outline: none;
    min-width: 130px;
  }
  .filter-btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.88rem;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text2);
    transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

  /* ===== CATEGORY TABS ===== */
  .category-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .cat-tab {
    padding: 8px 18px;
    border-radius: 24px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cat-tab.all { background: var(--primary); color: white; }
  .cat-tab.titanium { background: rgba(26,122,78,0.12); color: var(--tag-ti); border-color: rgba(26,122,78,0.3); }
  .cat-tab.titanium.active, .cat-tab.titanium:hover { background: var(--tag-ti); color: white; }
  .cat-tab.aluminum { background: rgba(26,90,154,0.12); color: var(--tag-al); border-color: rgba(26,90,154,0.3); }
  .cat-tab.aluminum.active, .cat-tab.aluminum:hover { background: var(--tag-al); color: white; }
  .cat-tab.steel { background: rgba(122,42,26,0.1); color: var(--tag-st); border-color: rgba(122,42,26,0.25); }
  .cat-tab.steel.active, .cat-tab.steel:hover { background: var(--tag-st); color: white; }
  .cat-tab.nickel { background: rgba(90,26,122,0.1); color: var(--tag-ni); border-color: rgba(90,26,122,0.25); }
  .cat-tab.nickel.active, .cat-tab.nickel:hover { background: var(--tag-ni); color: white; }
  .cat-count { background: rgba(255,255,255,0.8); border-radius: 10px; padding: 1px 7px; font-size: 0.75rem; }

  /* ===== MATERIAL CARDS ===== */
  .materials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 20px;
  }
  .material-card {
    background: var(--card);
    border-radius: 12px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .material-card:hover { box-shadow: 0 8px 28px rgba(26,58,92,0.12); transform: translateY(-2px); }
  .card-header {
    padding: 16px 20px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .card-title-group {}
  .card-material-name { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .card-material-formula { font-size: 0.78rem; color: var(--text3); font-family: 'Courier New', monospace; }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge-ti { background: rgba(26,122,78,0.12); color: var(--tag-ti); }
  .badge-al { background: rgba(26,90,154,0.12); color: var(--tag-al); }
  .badge-st { background: rgba(122,42,26,0.12); color: var(--tag-st); }
  .badge-ni { background: rgba(90,26,122,0.12); color: var(--tag-ni); }
  .badge-app { background: rgba(232,116,10,0.12); color: var(--accent); }

  /* TABS within card */
  .card-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #f8fafc;
  }
  .card-tab {
    flex: 1;
    padding: 9px 6px;
    font-size: 0.78rem;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    color: var(--text3);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .card-tab:hover { color: var(--text); }
  .card-tab.active { color: var(--primary-light); border-bottom-color: var(--primary-light); background: white; }
  .card-tab-content { display: none; padding: 16px 20px; }
  .card-tab-content.active { display: block; }

  /* PROCESS TABLES */
  .process-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 10px; }
  .process-table th {
    background: var(--primary);
    color: white;
    padding: 7px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 0.78rem;
  }
  .process-table th:first-child { border-radius: 0; }
  .process-table th:last-child { border-radius: 0; }
  .process-table td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.45;
    color: var(--text);
  }
  .process-table tr:last-child td { border-bottom: none; }
  .process-table tr:hover td { background: rgba(26,90,154,0.04); }
  .process-table .tr-alt { background: #f9fbfd; }
  .temp-value { color: var(--primary-light); font-weight: 600; }
  .cooling-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.74rem;
    font-weight: 600;
  }
  .cool-water { background: #dceeff; color: #1a5a9a; }
  .cool-air { background: #dcf4ec; color: #1a7a4e; }
  .cool-oil { background: #fff0dc; color: #9a5a1a; }
  .cool-furnace { background: #f0dcff; color: #5a1a9a; }

  /* ISSUES SECTION */
  .issue-item {
    background: var(--warn-bg);
    border: 1px solid rgba(200,64,10,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .issue-item:last-child { margin-bottom: 0; }
  .issue-title { font-weight: 700; color: var(--warn); font-size: 0.88rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .issue-body { font-size: 0.82rem; color: var(--text2); line-height: 1.6; }
  .issue-cause { margin-top: 6px; }
  .issue-solution { 
    background: var(--success-bg);
    border: 1px solid rgba(26,122,78,0.2);
    border-radius: 6px;
    padding: 8px 10px;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--success);
    line-height: 1.55;
  }
  .solution-label { font-weight: 700; margin-bottom: 3px; font-size: 0.8rem; }
  
  /* KEY PROPS */
  .key-props { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .key-prop {
    background: var(--info-bg);
    border: 1px solid rgba(26,90,154,0.15);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.8rem;
    color: var(--info);
  }
  .key-prop strong { display: block; font-size: 0.72rem; color: var(--text3); margin-bottom: 2px; font-weight: 600; }

  /* DEFORMATION PARAMS */
  .deform-zone {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .deform-chip {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 120px;
    flex: 1;
  }
  .deform-chip-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
  .deform-chip-value { font-weight: 600; font-size: 0.88rem; }
  .deform-chip-note { font-size: 0.72rem; opacity: 0.8; }
  .chip-temp { background: rgba(26,90,154,0.09); color: #1a5a9a; }
  .chip-rate { background: rgba(26,122,78,0.09); color: #1a7a4e; }
  .chip-deform { background: rgba(232,116,10,0.09); color: #9a5a0a; }
  .chip-warn { background: rgba(200,64,10,0.09); color: var(--warn); }

  /* SECTION TITLE in content */
  .section-h { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; margin-top: 14px; }
  .section-h:first-child { margin-top: 0; }

  /* ===== COMPARE PANEL ===== */
  #compare-section {
    display: none;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .compare-card {
    background: var(--card);
    border-radius: 10px;
    border: 1.5px solid var(--border);
    padding: 16px;
  }
  .compare-title { font-weight: 700; font-size: 1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .compare-row { display: flex; align-items: baseline; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 0.82rem; }
  .compare-row:last-child { border-bottom: none; }
  .compare-key { color: var(--text3); }
  .compare-val { color: var(--text); font-weight: 600; max-width: 55%; text-align: right; }

  /* ===== DETAIL MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(14,28,50,0.55);
    z-index: 200;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
  .modal-box {
    background: var(--card);
    border-radius: 14px;
    width: min(900px, 95vw);
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.35);
  }
  .modal-header {
    background: var(--primary);
    color: white;
    padding: 20px 28px;
    border-radius: 14px 14px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .modal-title { font-size: 1.3rem; font-weight: 700; }
  .modal-subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.75); margin-top: 4px; }
  .modal-close { background: rgba(255,255,255,0.15); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .modal-close:hover { background: rgba(255,255,255,0.28); }
  .modal-body { padding: 24px 28px; }
  .modal-section { margin-bottom: 24px; }
  .modal-section-title { font-size: 1rem; font-weight: 700; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 6px; margin-bottom: 14px; }

  /* ===== EMPTY STATE ===== */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .content-area { padding: 16px; }
    .materials-grid { grid-template-columns: 1fr; }
    .top-header { padding: 16px 20px; }
    .top-header h1 { font-size: 1.2rem; }
  }

  /* ===== SCROLL FADE ===== */
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* jump key */
  .material-card[data-id] { scroll-margin-top: 120px; }

  /* highlight search */
  .search-highlight { background: #fff3c4; border-radius: 2px; }

  /* expand/collapse */
  .expand-toggle { background: none; border: none; color: var(--primary-light); font-size: 0.8rem; cursor: pointer; padding: 4px 0; font-weight: 600; }
  .expand-toggle:hover { text-decoration: underline; }
  .expandable-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .expandable-content.expanded { max-height: 2000px; }
</style>
</head>
<body>

<!-- TOP HEADER -->
<div class="top-header">
  <div class="header-row">
    <div>
      <h1>🔬 先进合金热加工与热处理工艺数据库</h1>
      <p>钛合金 · 铝合金 · 超高强度钢 · 高温合金 ｜ 工艺参数 · 组织演变 · 常见缺陷与解决方案</p>
    </div>
    <div class="header-stats">
      <div class="stat-chip">合金种类 <span>15+</span></div>
      <div class="stat-chip">工艺条目 <span>200+</span></div>
      <div class="stat-chip">问题解决方案 <span>50+</span></div>
    </div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main-layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section-title">分类导航</div>
    <div class="nav-item active" onclick="filterCategory('all')">
      <span class="nav-dot" style="background:#64748b"></span> 全部材料
      <span class="nav-badge">15</span>
    </div>
    <div class="sidebar-section-title">钛合金</div>
    <div class="nav-item" onclick="jumpTo('TC4')"><span class="nav-dot" style="background:var(--tag-ti)"></span>TC4 (Ti-6Al-4V)</div>
    <div class="nav-item" onclick="jumpTo('TC17')"><span class="nav-dot" style="background:var(--tag-ti)"></span>TC17</div>
    <div class="nav-item" onclick="jumpTo('TC18')"><span class="nav-dot" style="background:var(--tag-ti)"></span>TC18</div>
    <div class="nav-item" onclick="jumpTo('TC21')"><span class="nav-dot" style="background:var(--tag-ti)"></span>TC21</div>
    <div class="nav-item" onclick="jumpTo('TC25')"><span class="nav-dot" style="background:var(--tag-ti)"></span>TC25</div>
    <div class="nav-item" onclick="jumpTo('TA15')"><span class="nav-dot" style="background:var(--tag-ti)"></span>TA15</div>
    <div class="sidebar-section-title">铝合金</div>
    <div class="nav-item" onclick="jumpTo('2024')"><span class="nav-dot" style="background:var(--tag-al)"></span>2024 铝合金</div>
    <div class="nav-item" onclick="jumpTo('7075')"><span class="nav-dot" style="background:var(--tag-al)"></span>7075 铝合金</div>
    <div class="nav-item" onclick="jumpTo('7050')"><span class="nav-dot" style="background:var(--tag-al)"></span>7050 铝合金</div>
    <div class="nav-item" onclick="jumpTo('2219')"><span class="nav-dot" style="background:var(--tag-al)"></span>2219 铝合金</div>
    <div class="sidebar-section-title">超高强度钢</div>
    <div class="nav-item" onclick="jumpTo('A100')"><span class="nav-dot" style="background:var(--tag-st)"></span>A-100 (AerMet100)</div>
    <div class="nav-item" onclick="jumpTo('300M')"><span class="nav-dot" style="background:var(--tag-st)"></span>300M</div>
    <div class="sidebar-section-title">高温合金</div>
    <div class="nav-item" onclick="jumpTo('GH4169')"><span class="nav-dot" style="background:var(--tag-ni)"></span>GH4169 (IN718)</div>
    <div class="nav-item" onclick="jumpTo('GH4698')"><span class="nav-dot" style="background:var(--tag-ni)"></span>GH4698</div>
  </div>

  <!-- CONTENT AREA -->
  <div class="content-area" id="main-content">
    <!-- SEARCH BAR -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索材料名称、工艺参数、温度范围..." oninput="doSearch(this.value)">
      </div>
      <select class="filter-select" id="typeFilter" onchange="filterByType(this.value)">
        <option value="all">全部工序</option>
        <option value="热处理">热处理</option>
        <option value="热变形">热变形</option>
      </select>
    </div>

    <!-- CATEGORY TABS -->
    <div class="category-tabs">
      <div class="cat-tab all active" onclick="filterCategory('all')">全部 <span class="cat-count">15</span></div>
      <div class="cat-tab titanium" onclick="filterCategory('titanium')">钛合金 <span class="cat-count">6</span></div>
      <div class="cat-tab aluminum" onclick="filterCategory('aluminum')">铝合金 <span class="cat-count">5</span></div>
      <div class="cat-tab steel" onclick="filterCategory('steel')">超高强度钢 <span class="cat-count">2</span></div>
      <div class="cat-tab nickel" onclick="filterCategory('nickel')">高温合金 <span class="cat-count">2</span></div>
    </div>

    <!-- MATERIALS GRID -->
    <div class="materials-grid" id="materialsGrid">
      <!-- Cards will be injected by JS -->
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">材料详情</div>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>

function renderCooling(cooling) {
  const map = {
    'water': '<span class="cooling-badge cool-water">水冷</span>',
    'air': '<span class="cooling-badge cool-air">空冷</span>',
    'oil': '<span class="cooling-badge cool-oil">油冷</span>',
    'furnace': '<span class="cooling-badge cool-furnace">炉冷</span>',
    'water/oil': '<span class="cooling-badge cool-water">水/油冷</span>',
    'water/air': '<span class="cooling-badge cool-water">水/空冷</span>',
    'fan': '<span class="cooling-badge cool-air">风冷</span>',
    'furnace/air': '<span class="cooling-badge cool-furnace">炉/空冷</span>',
    'water+air': '<span class="cooling-badge cool-water">水冷+空冷</span>',
  };
  return map[cooling] || `<span class="cooling-badge cool-air">${cooling}</span>`;
}

function renderCard(mat) {
  const badgeClass = { titanium: 'badge-ti', aluminum: 'badge-al', steel: 'badge-st', nickel: 'badge-ni' }[mat.category];
  const catName = { titanium: '钛合金', aluminum: '铝合金', steel: '超高强度钢', nickel: '高温合金' }[mat.category];
  const cardId = 'card-' + mat.id;

  // Heat treatment rows
  let htRows = mat.heatTreatment.map((r, i) => `
    <tr class="${i % 2 === 1 ? 'tr-alt' : ''}">
      <td>${r.process}</td>
      <td class="temp-value">${r.temp}</td>
      <td>${r.time}</td>
      <td>${renderCooling(r.cooling)}</td>
      <td style="color:var(--text3);font-size:0.78rem;">${r.note || ''}</td>
    </tr>`).join('');

  // Deformation chips
  let defChips = mat.deformation.zones.map(z => `
    <div class="deform-chip chip-${z.type}">
      <span class="deform-chip-label">${z.type === 'temp' ? '温度' : z.type === 'rate' ? '应变速率' : z.type === 'deform' ? '变形量' : '⚠ 禁忌区'}</span>
      <span class="deform-chip-value">${z.value}</span>
      <span class="deform-chip-note">${z.note}</span>
    </div>`).join('');

  // Issues
  let issueItems = mat.issues.slice(0, 3).map(iss => `
    <div class="issue-item">
      <div class="issue-title">⚠ ${iss.title}</div>
      <div class="issue-body">
        <div class="issue-cause"><b>原因：</b>${iss.cause}</div>
        <div class="issue-solution"><div class="solution-label">✓ 解决方案</div>${iss.solution}</div>
      </div>
    </div>`).join('');

  if (mat.issues.length > 3) {
    issueItems += `<button class="expand-toggle" onclick="showMoreIssues('${mat.id}')">+ 查看全部 ${mat.issues.length} 个问题</button>`;
  }

  // Key props
  let propsHtml = mat.keyProps.map(p => `<div class="key-prop"><strong>${p.label}</strong>${p.value}</div>`).join('');

  return `
<div class="material-card" id="${cardId}" data-id="${mat.id}" data-category="${mat.category}">
  <div class="card-header">
    <div class="card-title-group">
      <div class="card-material-name">${mat.name}</div>
      <div class="card-material-formula">${mat.formula}</div>
    </div>
    <div class="card-badges">
      <span class="badge ${badgeClass}">${catName}</span>
      ${mat.betaTemp !== '-' ? `<span class="badge badge-app">β相变点: ${mat.betaTemp}</span>` : ''}
    </div>
  </div>
  <div class="card-tabs">
    <div class="card-tab active" onclick="switchTab(this, '${mat.id}-overview')">概述</div>
    <div class="card-tab" onclick="switchTab(this, '${mat.id}-ht')">热处理工艺</div>
    <div class="card-tab" onclick="switchTab(this, '${mat.id}-def')">热变形参数</div>
    <div class="card-tab" onclick="switchTab(this, '${mat.id}-issues')">常见问题</div>
  </div>
  <!-- overview -->
  <div class="card-tab-content active" id="${mat.id}-overview">
    <p style="font-size:0.85rem;color:var(--text2);margin-bottom:12px;">${mat.desc}</p>
    <div class="section-h">应用领域</div>
    <p style="font-size:0.82rem;color:var(--text2);margin-bottom:12px;">${mat.application}</p>
    <div class="section-h">关键性能指标</div>
    <div class="key-props">${propsHtml}</div>
    <button class="expand-toggle" onclick="openModal('${mat.id}')">📋 查看完整详情 →</button>
  </div>
  <!-- heat treatment -->
  <div class="card-tab-content" id="${mat.id}-ht">
    <div style="overflow-x:auto;">
      <table class="process-table">
        <thead><tr><th>工序</th><th>温度</th><th>时间</th><th>冷却</th><th>说明</th></tr></thead>
        <tbody>${htRows}</tbody>
      </table>
    </div>
  </div>
  <!-- deformation -->
  <div class="card-tab-content" id="${mat.id}-def">
    <div class="section-h">工序类型：${mat.deformation.process}</div>
    <div class="deform-zone">${defChips}</div>
    <div class="section-h">详细说明</div>
    <p style="font-size:0.8rem;color:var(--text2);line-height:1.6;">${mat.deformation.detail}</p>
  </div>
  <!-- issues -->
  <div class="card-tab-content" id="${mat.id}-issues">
    ${issueItems}
  </div>
</div>`;
}

function switchTab(el, contentId) {
  const card = el.closest('.material-card');
  card.querySelectorAll('.card-tab').forEach(t => t.classList.remove('active'));
  card.querySelectorAll('.card-tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(contentId).classList.add('active');
}

function renderAll() {
  const grid = document.getElementById('materialsGrid');
  let filtered = MATERIALS.filter(m => {
    if (currentCategory !== 'all' && m.category !== currentCategory) return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      const hay = (m.name + m.formula + m.desc + m.application + m.heatTreatment.map(r => r.process + r.temp + r.note).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><p>未找到匹配的材料，请尝试其他搜索词</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(renderCard).join('');
}

// ===================================================================
// FILTER & SEARCH
// ===================================================================
function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  const mapping = { all: 'all', titanium: 'titanium', aluminum: 'aluminum', steel: 'steel', nickel: 'nickel' };
  document.querySelectorAll('.cat-tab').forEach(t => {
    if (t.textContent.includes({ all: '全部', titanium: '钛合金', aluminum: '铝合金', steel: '超高强度钢', nickel: '高温合金' }[cat])) {
      t.classList.add('active');
    }
  });
  // also handle all tab
  if (cat === 'all') document.querySelector('.cat-tab.all').classList.add('active');
  renderAll();
}

function doSearch(val) {
  currentSearch = val.trim();
  renderAll();
}

function filterByType(val) {
  currentType = val;
  renderAll();
}

function jumpTo(id) {
  renderAll();
  currentCategory = 'all';
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

// ===================================================================
// MODAL
// ===================================================================
function openModal(matId) {
  const mat = MATERIALS.find(m => m.id === matId);
  if (!mat) return;
  const catName = { titanium: '钛合金', aluminum: '铝合金', steel: '超高强度钢', nickel: '高温合金' }[mat.category];
  document.getElementById('modalTitle').textContent = mat.name;
  document.getElementById('modalSubtitle').textContent = `${mat.formula} | ${catName} | ${mat.application}`;

  let allHtRows = mat.heatTreatment.map((r, i) => `
    <tr class="${i % 2 === 1 ? 'tr-alt' : ''}">
      <td>${r.process}</td>
      <td class="temp-value">${r.temp}</td>
      <td>${r.time}</td>
      <td>${renderCooling(r.cooling)}</td>
      <td style="font-size:0.78rem;color:var(--text3);">${r.note || ''}</td>
    </tr>`).join('');

  let allIssues = mat.issues.map(iss => `
    <div class="issue-item">
      <div class="issue-title">⚠ ${iss.title}</div>
      <div class="issue-body">
        <div class="issue-cause"><b>原因：</b>${iss.cause}</div>
        <div class="issue-solution"><div class="solution-label">✓ 解决方案</div>${iss.solution}</div>
      </div>
    </div>`).join('');

  let propsHtml = mat.keyProps.map(p => `<div class="key-prop"><strong>${p.label}</strong>${p.value}</div>`).join('');

  let defChips = mat.deformation.zones.map(z => `
    <div class="deform-chip chip-${z.type}">
      <span class="deform-chip-label">${z.type === 'temp' ? '温度' : z.type === 'rate' ? '应变速率' : z.type === 'deform' ? '变形量' : '⚠ 禁忌区'}</span>
      <span class="deform-chip-value">${z.value}</span>
      <span class="deform-chip-note">${z.note}</span>
    </div>`).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">材料描述</div>
      <p style="font-size:0.9rem;color:var(--text2);line-height:1.7;">${mat.desc}</p>
      <div style="margin-top:10px;"><b style="font-size:0.85rem;">应用领域：</b><span style="color:var(--text2);font-size:0.85rem;">${mat.application}</span></div>
      ${mat.betaTemp !== '-' ? `<div style="margin-top:6px;"><b style="font-size:0.85rem;">β/奥氏体相变温度：</b><span style="color:var(--primary-light);font-weight:600;">${mat.betaTemp}</span></div>` : ''}
    </div>
    <div class="modal-section">
      <div class="modal-section-title">关键性能指标</div>
      <div class="key-props">${propsHtml}</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">热处理工艺参数（完整）</div>
      <div style="overflow-x:auto;">
        <table class="process-table">
          <thead><tr><th>工序类型</th><th>温度</th><th>保温时间</th><th>冷却方式</th><th>说明与备注</th></tr></thead>
          <tbody>${allHtRows}</tbody>
        </table>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">热变形工艺参数</div>
      <p style="font-size:0.83rem;color:var(--text3);margin-bottom:8px;">工序：${mat.deformation.process}</p>
      <div class="deform-zone">${defChips}</div>
      <div style="background:var(--info-bg);border:1px solid rgba(26,90,154,0.15);border-radius:8px;padding:12px;font-size:0.82rem;color:var(--text2);line-height:1.65;margin-top:8px;">${mat.deformation.detail}</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">热处理/热加工常见问题与解决方案（全部 ${mat.issues.length} 项）</div>
      ${allIssues}
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
}

document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

function showMoreIssues(matId) {
  openModal(matId);
}

// ===================================================================
// INIT
// ===================================================================
renderAll();
</script>
</body>
</html>

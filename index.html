<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高端合金材料热加工工艺交互式数据库</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-bg:#f8f8f6;
  --color-surface:#ffffff;
  --color-border:#e4e2da;
  --color-border-mid:#cccac0;
  --color-text:#2c2c2a;
  --color-text-2:#5f5e5a;
  --color-text-3:#888780;
  --radius-md:8px;
  --radius-lg:12px;
  --radius-xl:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;color:var(--color-text);background:var(--color-bg);line-height:1.6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* Layout */
.app-shell{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem}
.header{margin-bottom:1.5rem}
.header h1{font-size:18px;font-weight:500;color:var(--color-text);margin-bottom:4px}
.header p{font-size:13px;color:var(--color-text-2)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;margin-right:6px;margin-bottom:4px}

/* Nav Tabs */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin-bottom:1.5rem;overflow-x:auto;padding-bottom:1px}
.tab-btn{padding:6px 14px;font-size:13px;border:none;background:transparent;cursor:pointer;color:var(--color-text-2);border-radius:var(--radius-md) var(--radius-md) 0 0;white-space:nowrap;transition:color .15s}
.tab-btn:hover{color:var(--color-text)}
.tab-btn.active{color:#185FA5;border-bottom:2px solid #185FA5;font-weight:500}

/* Category filter chips */
.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem;align-items:center}
.filter-label{font-size:12px;color:var(--color-text-3);margin-right:4px}
.chip{padding:4px 12px;border-radius:99px;border:0.5px solid var(--color-border-mid);background:var(--color-surface);cursor:pointer;font-size:12px;color:var(--color-text-2);transition:all .15s}
.chip:hover{border-color:#378ADD;color:#185FA5}
.chip.active{background:#E6F1FB;border-color:#378ADD;color:#185FA5;font-weight:500}

/* Search */
.search-wrap{position:relative;margin-bottom:1.5rem}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;border:0.5px solid var(--color-border-mid);border-radius:var(--radius-lg);background:var(--color-surface);font-size:13px;color:var(--color-text)}
.search-wrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-text-3);font-size:14px}

/* Material Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.m-card{background:var(--color-surface);border:0.5px solid var(--color-border);border-radius:var(--radius-lg);cursor:pointer;transition:border-color .15s;overflow:hidden}
.m-card:hover{border-color:var(--color-border-mid)}
.m-card.expanded{border-color:#378ADD}
.m-card-head{padding:14px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.m-card-title{font-size:14px;font-weight:500;color:var(--color-text)}
.m-card-sub{font-size:12px;color:var(--color-text-2);margin-top:2px}
.m-card-cat{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cat-tag{font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap;font-weight:500}
.cat-superalloy{background:#EEEDFE;color:#534AB7}
.cat-aluminum{background:#EAF3DE;color:#3B6D11}
.cat-titanium{background:#E1F5EE;color:#0F6E56}
.cat-steel{background:#FAECE7;color:#993C1D}

.m-card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 14px}
.metric-item{background:#F8F8F6;border-radius:var(--radius-md);padding:8px 10px}
.metric-label{font-size:11px;color:var(--color-text-3);margin-bottom:2px}
.metric-val{font-size:13px;font-weight:500;color:var(--color-text)}

/* Detail Panel */
.m-detail{background:#F1EFE8;border-top:0.5px solid var(--color-border);padding:16px;display:none}
.m-detail.open{display:block}
.detail-section{margin-bottom:14px}
.detail-section:last-child{margin-bottom:0}
.detail-title{font-size:12px;font-weight:500;color:var(--color-text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-bottom:4px;border-bottom:0.5px solid var(--color-border)}
.proc-table{width:100%;border-collapse:collapse;font-size:12px}
.proc-table th{text-align:left;color:var(--color-text-3);font-weight:400;padding:4px 8px;border-bottom:0.5px solid var(--color-border)}
.proc-table td{padding:5px 8px;border-bottom:0.5px solid #eeece5;color:var(--color-text)}
.proc-table tr:last-child td{border-bottom:none}
.proc-table tr:hover td{background:rgba(55,138,221,.05)}
.note-box{background:#fff;border-left:3px solid #378ADD;padding:8px 10px;border-radius:0 var(--radius-md) var(--radius-md) 0;font-size:12px;color:var(--color-text-2);margin-top:8px}
.note-box.warn{border-color:#BA7517;background:#FAEEDA}
.note-box.danger{border-color:#E24B4A;background:#FCEBEB}

/* Compare Tab */
.compare-select-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.compare-select-row select{width:100%;padding:8px 12px;border:0.5px solid var(--color-border-mid);border-radius:var(--radius-lg);background:var(--color-surface);font-size:13px}
.compare-table-wrap{overflow-x:auto}
.compare-table{width:100%;border-collapse:collapse;font-size:12px}
.compare-table th{background:var(--color-surface);border:0.5px solid var(--color-border);padding:8px 12px;font-weight:500;text-align:left;position:sticky;top:0}
.compare-table td{border:0.5px solid var(--color-border);padding:8px 12px;vertical-align:top}
.compare-table tr:nth-child(even) td{background:#FAFAF8}
.compare-table .row-head{background:var(--color-surface);font-weight:500;color:var(--color-text-2);font-size:11px}

/* Chart tab */
.chart-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
.chart-controls select{padding:6px 10px;border:0.5px solid var(--color-border-mid);border-radius:var(--radius-md);background:var(--color-surface);font-size:12px}
.chart-wrap{background:var(--color-surface);border:0.5px solid var(--color-border);border-radius:var(--radius-lg);padding:1rem}

/* Responsive */
@media(max-width:640px){
  .compare-select-row{grid-template-columns:1fr}
  .cards-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app-shell">
  <h2 class="sr-only">高端合金材料热加工与热处理工艺交互式数据库，涵盖高温合金、铝合金、钛合金、超高强度钢四大类材料的详细工艺参数。</h2>

  <div class="header">
    <h1>高端合金材料热加工工艺数据库</h1>
    <p>基于航空航天材料手册、学术文献及工业规范构建 &nbsp;·&nbsp; 涵盖热处理与热变形工艺参数</p>
    <div style="margin-top:8px">
      <span class="badge cat-superalloy">高温合金 2种</span>
      <span class="badge cat-aluminum">铝合金 7种</span>
      <span class="badge cat-titanium">钛合金 6种</span>
      <span class="badge cat-steel">超高强度钢 2种</span>
    </div>
  </div>

  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" role="tab" onclick="switchTab('browse',this)">材料浏览</button>
    <button class="tab-btn" role="tab" onclick="switchTab('compare',this)">对比查询</button>
    <button class="tab-btn" role="tab" onclick="switchTab('chart',this)">工艺图表</button>
  </div>

  <!-- ===== BROWSE TAB ===== -->
  <div id="tab-browse">
    <div class="filter-row">
      <span class="filter-label">分类筛选：</span>
      <button class="chip active" onclick="filterCat('all',this)">全部</button>
      <button class="chip" onclick="filterCat('superalloy',this)">高温合金</button>
      <button class="chip" onclick="filterCat('aluminum',this)">铝合金</button>
      <button class="chip" onclick="filterCat('titanium',this)">钛合金</button>
      <button class="chip" onclick="filterCat('steel',this)">超高强度钢</button>
    </div>
    <div class="search-wrap">
      <span class="icon">⌕</span>
      <input type="text" id="searchInput" placeholder="搜索材料牌号、成分、应用..." oninput="doSearch(this.value)">
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- ===== COMPARE TAB ===== -->
  <div id="tab-compare" style="display:none">
    <div class="compare-select-row">
      <div>
        <div style="font-size:12px;color:var(--color-text-2);margin-bottom:6px">材料 A</div>
        <select id="cmpA" onchange="renderCompare()"></select>
      </div>
      <div>
        <div style="font-size:12px;color:var(--color-text-2);margin-bottom:6px">材料 B</div>
        <select id="cmpB" onchange="renderCompare()"></select>
      </div>
    </div>
    <div class="compare-table-wrap" id="compareOut"></div>
  </div>

  <!-- ===== CHART TAB ===== -->
  <div id="tab-chart" style="display:none">
    <div class="chart-controls">
      <select id="chartType" onchange="renderCharts()">
        <option value="temp">热变形温度范围</option>
        <option value="strain">应变速率范围</option>
        <option value="ht_temp">热处理温度对比</option>
      </select>
    </div>
    <div class="chart-wrap" style="margin-bottom:1rem">
      <div style="position:relative;height:420px">
        <canvas id="mainChart" role="img" aria-label="合金材料热加工参数对比图">暂无数据</canvas>
      </div>
    </div>
    <div id="chartLegend" style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--color-text-2);padding:0 4px"></div>
  </div>
</div>

// ===== UTILITIES =====
let activeTab = "browse";
let activeCat = "all";
let searchQ = "";
let chartInstance = null;

function getFiltered(){
  return MATERIALS.filter(m=>{
    if(activeCat!=="all"&&m.cat!==activeCat) return false;
    if(!searchQ) return true;
    const q=searchQ.toLowerCase();
    return (m.name+m.desc+m.comp+m.app+m.id).toLowerCase().includes(q);
  });
}

// ===== BROWSE TAB =====
function renderCards(){
  const grid=document.getElementById("cardsGrid");
  const items=getFiltered();
  if(!items.length){grid.innerHTML='<p style="color:var(--color-text-3);padding:2rem 0">未找到匹配的材料</p>';return;}
  grid.innerHTML=items.map(m=>`
    <div class="m-card" id="card-${m.id}" onclick="toggleCard('${m.id}')">
      <div class="m-card-head">
        <div>
          <div class="m-card-title">${m.name}</div>
          <div class="m-card-sub">${m.desc}</div>
          <div style="font-size:11px;color:var(--color-text-3);margin-top:3px">${m.comp}</div>
        </div>
        <div class="m-card-cat">
          <span class="cat-tag cat-${m.cat}">${catLabel(m.cat)}</span>
        </div>
      </div>
      <div class="m-card-metrics">
        <div class="metric-item">
          <div class="metric-label">热变形温度</div>
          <div class="metric-val">${m.deform.tempMin}~${m.deform.tempMax}℃</div>
        </div>
        <div class="metric-item">
          <div class="metric-label">推荐应变速率</div>
          <div class="metric-val">${m.deform.strainMin}~${m.deform.strainMax} s⁻¹</div>
        </div>
      </div>
      <div class="m-detail" id="detail-${m.id}">
        ${renderDetail(m)}
      </div>
    </div>
  `).join("");
}

function toggleCard(id){
  const card=document.getElementById("card-"+id);
  const det=document.getElementById("detail-"+id);
  const open=det.classList.contains("open");
  det.classList.toggle("open",!open);
  card.classList.toggle("expanded",!open);
}

function renderDetail(m){
  const htRows=m.ht.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]||"—"}</td></tr>`).join("");
  const dRows=m.deform.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]||"—"}</td></tr>`).join("");
  return `
    <div class="detail-section">
      <div class="detail-title">热处理工艺</div>
      <div style="font-size:11px;color:var(--color-text-3);margin-bottom:6px">主强化相：${m.ht.keyPhase}</div>
      <div style="overflow-x:auto">
      <table class="proc-table">
        <thead><tr><th>工艺步骤</th><th>温度</th><th>时间</th><th>冷却</th><th>说明</th></tr></thead>
        <tbody>${htRows}</tbody>
      </table>
      </div>
      <div class="note-box">${m.ht.notes}</div>
    </div>
    <div class="detail-section">
      <div class="detail-title">热变形工艺</div>
      <div style="overflow-x:auto">
      <table class="proc-table">
        <thead><tr><th>参数</th><th>数值</th><th>说明</th></tr></thead>
        <tbody>${dRows}</tbody>
      </table>
      </div>
      <div class="note-box warn">${m.deform.notes}</div>
    </div>
    <div class="detail-section">
      <div class="detail-title">应用场合</div>
      <div style="font-size:12px;color:var(--color-text-2)">${m.app}</div>
      <div style="font-size:11px;color:var(--color-text-3);margin-top:4px">执行标准：${m.std}</div>
    </div>
  `;
}

function catLabel(c){
  const m={superalloy:"高温合金",aluminum:"铝合金",titanium:"钛合金",steel:"超高强度钢"};
  return m[c]||c;
}

function filterCat(cat,el){
  activeCat=cat;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  renderCards();
}

function doSearch(q){
  searchQ=q;
  renderCards();
}

// ===== COMPARE TAB =====
function initCompareSelects(){
  const sel=["cmpA","cmpB"];
  sel.forEach((id,i)=>{
    const s=document.getElementById(id);
    s.innerHTML=MATERIALS.map(m=>`<option value="${m.id}">${m.name}</option>`).join("");
    s.selectedIndex=i;
  });
  renderCompare();
}

function renderCompare(){
  const idA=document.getElementById("cmpA").value;
  const idB=document.getElementById("cmpB").value;
  const A=MATERIALS.find(m=>m.id===idA);
  const B=MATERIALS.find(m=>m.id===idB);
  if(!A||!B){return;}
  const rows=[
    ["类别",catLabel(A.cat),catLabel(B.cat)],
    ["成分体系",A.comp,B.comp],
    ["应用场合",A.app,B.app],
    ["执行标准",A.std,B.std],
    ["主强化相",A.ht.keyPhase,B.ht.keyPhase],
    ["热变形温度范围",A.deform.tempMin+"~"+A.deform.tempMax+"℃",B.deform.tempMin+"~"+B.deform.tempMax+"℃"],
    ["最佳热变形温度",A.deform.bestMin+"~"+A.deform.bestMax+"℃",B.deform.bestMin+"~"+B.deform.bestMax+"℃"],
    ["推荐应变速率",A.deform.strainMin+"~"+A.deform.strainMax+" s⁻¹",B.deform.strainMin+"~"+B.deform.strainMax+" s⁻¹"],
    ["热变形激活能",A.deform.activation,B.deform.activation],
    ["变形方式",A.deform.mode,B.deform.mode],
    ["单次变形量",A.deform.singlePass||"—",B.deform.singlePass||"—"],
    ["热变形注意事项",A.deform.notes,B.deform.notes],
    ["热处理工艺要点",A.ht.notes,B.ht.notes],
  ];
  const html=`
    <table class="compare-table">
      <thead>
        <tr>
          <th style="width:140px">参数</th>
          <th style="color:#185FA5">${A.name}</th>
          <th style="color:#3B6D11">${B.name}</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r=>`<tr><td class="row-head">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
      </tbody>
    </table>
  `;
  document.getElementById("compareOut").innerHTML=html;
}

// ===== CHART TAB =====
function renderCharts(){
  const type=document.getElementById("chartType").value;
  const canvas=document.getElementById("mainChart");
  if(chartInstance){chartInstance.destroy();chartInstance=null;}

  const catColors={
    superalloy:{bg:"rgba(83,74,183,0.7)",border:"#534AB7"},
    aluminum:{bg:"rgba(59,109,17,0.7)",border:"#3B6D11"},
    titanium:{bg:"rgba(15,110,86,0.7)",border:"#0F6E56"},
    steel:{bg:"rgba(153,60,29,0.7)",border:"#993C1D"},
  };

  if(type==="temp"){
    const labels=MATERIALS.map(m=>m.id);
    const minData=MATERIALS.map(m=>m.deform.bestMin);
    const maxData=MATERIALS.map(m=>m.deform.bestMax-m.deform.bestMin);
    const bgColors=MATERIALS.map(m=>catColors[m.cat].bg);
    const borderColors=MATERIALS.map(m=>catColors[m.cat].border);
    chartInstance=new Chart(canvas,{
      type:"bar",
      data:{
        labels,
        datasets:[
          {label:"起始温度",data:minData,backgroundColor:"rgba(200,200,200,0.4)",borderColor:"#aaa",borderWidth:0.5,stack:"s"},
          {label:"最佳热变形温度区间",data:maxData,backgroundColor:bgColors,borderColor:borderColors,borderWidth:1,stack:"s"},
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        scales:{
          x:{ticks:{autoSkip:false,maxRotation:45,font:{size:11}},stacked:true},
          y:{title:{display:true,text:"温度 (℃)"},stacked:false,min:0}
        },
        plugins:{legend:{display:false},tooltip:{callbacks:{
          label:(c)=>{
            if(c.datasetIndex===1){
              const m=MATERIALS[c.dataIndex];
              return `最佳区间: ${m.deform.bestMin}~${m.deform.bestMax}℃`;
            }
            return null;
          }
        }}}
      }
    });
    renderLegend(["高温合金","铝合金","钛合金","超高强度钢"],["#534AB7","#3B6D11","#0F6E56","#993C1D"]);
  } else if(type==="strain"){
    const labels=MATERIALS.map(m=>m.id);
    const minData=MATERIALS.map(m=>Math.log10(m.deform.strainMin));
    const rangeData=MATERIALS.map(m=>Math.log10(m.deform.strainMax)-Math.log10(m.deform.strainMin));
    const bgColors=MATERIALS.map(m=>catColors[m.cat].bg);
    const borderColors=MATERIALS.map(m=>catColors[m.cat].border);
    chartInstance=new Chart(canvas,{
      type:"bar",
      data:{
        labels,
        datasets:[
          {label:"起始（log）",data:minData,backgroundColor:"rgba(200,200,200,0.3)",borderWidth:0,stack:"s"},
          {label:"推荐应变速率区间(log₁₀)",data:rangeData,backgroundColor:bgColors,borderColor:borderColors,borderWidth:1,stack:"s"},
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        scales:{
          x:{ticks:{autoSkip:false,maxRotation:45,font:{size:11}},stacked:true},
          y:{title:{display:true,text:"log₁₀(应变速率 / s⁻¹)"},stacked:false,
             ticks:{callback:v=>`10^${v}`}}
        },
        plugins:{legend:{display:false},tooltip:{callbacks:{
          label:(c)=>{
            if(c.datasetIndex===1){
              const m=MATERIALS[c.dataIndex];
              return `推荐: ${m.deform.strainMin}~${m.deform.strainMax} s⁻¹`;
            }
            return null;
          }
        }}}
      }
    });
    renderLegend(["高温合金","铝合金","钛合金","超高强度钢"],["#534AB7","#3B6D11","#0F6E56","#993C1D"]);
  } else if(type==="ht_temp"){
    // 固溶温度对比 - 提取第一个固溶/奥氏体化步骤温度
    const htData={
      superalloy:[1160,1010],aluminum:[500,482,535,530,499,477,482],titanium:[950,820,900,930,985,825],steel:[885,870]
    };
    const selected=[
      {name:"GH4698固溶",val:1160,cat:"superalloy"},
      {name:"GH4698中间处理",val:1000,cat:"superalloy"},
      {name:"GH4169固溶(标准)",val:965,cat:"superalloy"},
      {name:"GH4169时效1",val:720,cat:"superalloy"},
      {name:"2014固溶",val:502,cat:"aluminum"},
      {name:"2024固溶",val:494,cat:"aluminum"},
      {name:"2219固溶",val:535,cat:"aluminum"},
      {name:"2618固溶",val:530,cat:"aluminum"},
      {name:"7075固溶",val:482,cat:"aluminum"},
      {name:"7050固溶",val:477,cat:"aluminum"},
      {name:"TC4固溶",val:940,cat:"titanium"},
      {name:"TC17固溶",val:800,cat:"titanium"},
      {name:"TC18固溶",val:900,cat:"titanium"},
      {name:"TC21固溶",val:930,cat:"titanium"},
      {name:"TA15退火",val:825,cat:"titanium"},
      {name:"A100固溶",val:885,cat:"steel"},
      {name:"A100时效",val:482,cat:"steel"},
      {name:"300M奥氏体化",val:870,cat:"steel"},
      {name:"300M回火",val:300,cat:"steel"},
    ];
    chartInstance=new Chart(canvas,{
      type:"bar",
      data:{
        labels:selected.map(d=>d.name),
        datasets:[{
          label:"热处理温度",
          data:selected.map(d=>d.val),
          backgroundColor:selected.map(d=>catColors[d.cat].bg),
          borderColor:selected.map(d=>catColors[d.cat].border),
          borderWidth:1
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,indexAxis:"y",
        layout:{padding:{right:40}},
        scales:{
          x:{title:{display:true,text:"温度 (℃)"},min:0,max:1300},
          y:{ticks:{font:{size:11}}}
        },
        plugins:{legend:{display:false}}
      }
    });
    renderLegend(["高温合金","铝合金","钛合金","超高强度钢"],["#534AB7","#3B6D11","#0F6E56","#993C1D"]);
    canvas.parentElement.style.height="680px";
  }
}

function renderLegend(labels,colors){
  const wrap=document.getElementById("chartLegend");
  wrap.innerHTML=labels.map((l,i)=>`
    <span style="display:flex;align-items:center;gap:4px">
      <span style="width:10px;height:10px;border-radius:2px;background:${colors[i]};display:inline-block"></span>${l}
    </span>
  `).join("");
}

// ===== TAB SWITCH =====
function switchTab(tab,el){
  activeTab=tab;
  document.getElementById("tab-browse").style.display=tab==="browse"?"block":"none";
  document.getElementById("tab-compare").style.display=tab==="compare"?"block":"none";
  document.getElementById("tab-chart").style.display=tab==="chart"?"block":"none";
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
  if(tab==="compare") initCompareSelects();
  if(tab==="chart") renderCharts();
}

// Init
renderCards();
</script>
